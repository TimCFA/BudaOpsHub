services:
  - type: web
    name: buda-ops-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker process: the server keeps the latest saved data in memory
    # (app.py, "SAVED STATE"). More threads are fine; more workers are not.
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Levelset share code for the PEA sync (the end of the share link).
      - key: LEVELSET_PEA_TOKEN
        sync: false
      # Secret for the read-only set up feed (/api/setup-feed), 32+ random
      # characters. Leave unset to keep the feed off.
      - key: SETUP_FEED_TOKEN
        sync: false
      # The daily briefing feed (/api/briefing): which topics it may serve,
      # comma-separated (setup, sales, projections, guest, waste, people).
      # Leave unset to keep it off.
      - key: BRIEFING_TOPICS
        sync: false
      # A second, different secret (32+ characters) that also unlocks the
      # people topic (names: roster and PEA ratings). Leave unset for none.
      - key: BRIEFING_PEOPLE_TOKEN
        sync: false
    routes:
      - path: /
        matchType: prefix
        dest: /index.html
