services:
  - type: web
    name: buda-ops-hub
    runtime: python
    # Standard ($25 a month, Tim, Oct 21 2026): always on, never sleeps.
    plan: standard
    buildCommand: pip install -r requirements.txt
    # One worker process: the server keeps the latest saved data in memory
    # (app.py, "SAVED STATE"). More threads are fine; more workers are not.
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Levelset share code for the PEA sync (the end of the share link).
      - key: LEVELSET_PEA_TOKEN
        sync: false
      # Sign in with Google (accounts.js / app.py ACCOUNTS): the OAuth
      # "Web application" client ID from Google Cloud Console, with this
      # site as an authorized JavaScript origin. Unset = no Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Who manages the account lists (comma-separated emails): directors
      # who also see Manage → Settings → Accounts.
      - key: ACCOUNT_OWNER_EMAILS
        sync: false
      # Email domains whose Google accounts are directors (default cfabuda.com).
      - key: DIRECTOR_EMAIL_DOMAINS
        value: cfabuda.com
      # Secret for the read-only set up feed (/api/setup-feed), 32+ random
      # characters. Leave unset to keep the feed off.
      - key: SETUP_FEED_TOKEN
        sync: false
      # The daily briefing feed (/api/briefing): which topics it may serve,
      # comma-separated (setup, sales, projections, guest, waste, people).
      # Leave unset to keep it off.
      - key: BRIEFING_TOPICS
        sync: false
      # A second, different secret (32+ characters) that also unlocks the
      # people topic (names: roster and PEA ratings). Leave unset for none.
      - key: BRIEFING_PEOPLE_TOKEN
        sync: false
    routes:
      - path: /
        matchType: prefix
        dest: /index.html
