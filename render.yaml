services:
  - type: web
    name: buda-ops-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker process: the server keeps the latest saved data in memory
    # (app.py, "SAVED STATE"). More threads are fine; more workers are not.
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Levelset share code for the PEA sync (the end of the share link).
      - key: LEVELSET_PEA_TOKEN
        sync: false
      # Secret for the read-only set up feed (/api/setup-feed), 32+ random
      # characters. Leave unset to keep the feed off.
      - key: SETUP_FEED_TOKEN
        sync: false
    routes:
      - path: /
        matchType: prefix
        dest: /index.html
