services:
  - type: web
    name: buda-ops-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker process: the server keeps the latest saved data in memory
    # (app.py, "SAVED STATE"). More threads are fine; more workers are not.
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Last part of the Levelset public Positional Excellence link
      # (app.levelset.io/public/positional-excellence/<token>). Set it in the
      # Render dashboard; it lets anyone holding it read the ratings.
      - key: LEVELSET_PEA_TOKEN
        sync: false
      # Only if the restaurant isn't on Central time (default America/Chicago).
      - key: LEVELSET_TIMEZONE
        sync: false
    routes:
      - path: /
        matchType: prefix
        dest: /index.html
