services:
  - type: web
    name: buda-ops-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker process: the server keeps the latest saved data in memory
    # (app.py, "SAVED STATE"). More threads are fine; more workers are not.
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    routes:
      - path: /
        matchType: prefix
        dest: /index.html
