<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/taskhub.css">
<style>body{margin:0;background:#F6F1E8;} .th-standalone{max-width:1100px;margin:0 auto;padding:16px 20px 60px;}</style>
</head>
<body>
<div class="th-standalone">
  <div id="tasksView" data-taskhub-api="{{ api_base }}"></div>
</div>
<script>function escapeHtml(s){return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));}</script>
<script src="/static/js/spanish.js"></script>
<script src="/static/js/taskhub.js"></script>
<script>TaskHub.mount(document.getElementById('tasksView'));</script>
</body>
</html>
